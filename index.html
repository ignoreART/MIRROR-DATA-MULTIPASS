<!DOCTYPE html>
<!--
  MIRROR Multipass Card - Enhanced API Integration

  ===========================================
  API SOURCES & FALLBACK CHAIN:
  ===========================================

  XCH PRICE (USD):
  1. CoinGecko API (Primary) - https://api.coingecko.com/api/v3/simple/price?ids=chia
     - Most reliable and widely used crypto price API
     - Free tier available, good rate limits
     - 5-minute cache to avoid rate limiting

  2. SpaceScan API (Secondary) - https://api.spacescan.io/stats/price?currency=usd
     - Fallback if CoinGecko fails
     - Chia-specific API

  3. Cached Price (Tertiary)
     - Uses last successful price if both APIs fail
     - TTL: 5 minutes

  TOKEN DATA:
  1. Dexie.space API - https://api.dexie.space/v1/cats
     - Primary source for MIRROR token data
     - Includes holders, supply, and price in XCH
     - Enhanced with retry logic (3 attempts with exponential backoff)

  2. Manual/Hardcoded Data
     - Fallback if APIs fail
     - Can be toggled via MANUAL_DATA.enabled flag

  ===========================================
  FEATURES:
  ===========================================
  - Multi-source API fetching with automatic fallbacks
  - Response caching to minimize API calls
  - Retry logic with exponential backoff
  - Real-time status indicators showing API source
  - Comprehensive error handling
  - World clocks for multiple time zones
  - Auto-refresh every 10 minutes

  ===========================================
  STATUS INDICATORS:
  ===========================================
  - Green: Active API (CoinGecko/SpaceScan/Dexie)
  - Cyan: Using cached data
  - Blue: Manual/hardcoded data
  - Orange: Loading/trying
  - Red: Error

-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRROR Multipass Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
    :root {
      --frame-bg: linear-gradient(145deg, #dcdcdc, #a8a8a8, #8d8d8d, #c2c2c2);
      --frame-border: #676a6c;
      --accent-color: #ff9500;
      --glass-tint: rgba(34, 139, 34, 0.15);
    }
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101010;
      font-family: 'Orbitron', sans-serif;
      color: #e0e0e0;
    }
    #card {
      width: 480px;
      height: 650px;
      background: var(--frame-bg);
      border: 2px solid var(--frame-border);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .accent {
      width: 30px;
      height: 30px;
      background: var(--accent-color);
      border-radius: 6px;
      position: absolute;
    }
    .accent.tl { top: 10px; left: 10px; }
    .accent.br { bottom: 10px; right: 10px; }
    #header {
      height: 90px;
      border-bottom: 1px solid rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      padding: 10px 20px;
    }
    #header h1 {
      font-size: 1.6rem;
      margin: 0;
      color: #222;
      margin-right: auto;
    }
    #header img.mirror-logo {
      width: 60px;
      height: 60px;
      margin-right: 16px;
    }
    #aeBadge {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e1e4e6, #c7c9cb, #f9f9fa);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      border: 2px solid #a2a4a8;
      box-shadow:
        0 0 0 4px rgba(193, 137, 69, 0.6),
        inset 0 2px 3px rgba(255,255,255,0.8),
        inset 0 -2px 3px rgba(0,0,0,0.3);
    }
    #viewport {
      flex: 1;
      margin: 20px;
      border: 3px solid #444;
      border-radius: 12px;
      background: var(--glass-tint);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    #stats {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #stats div {
      font-size: 1rem;
      color: #e7fff7;
      text-shadow: 0 0 4px rgba(0,255,255,0.8);
      display: flex;
      justify-content: space-between;
    }
    #stats div span:nth-child(1) {
      color: rgba(200, 255, 215, 0.8);
    }
    #footer {
      height: 70px;
      background: linear-gradient(90deg, #4f5152, #656667, #4f5152);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.3);
    }
    #footer h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #c0c8d0;
    }
    #footer p {
      margin: 2px 0 0;
      font-size: 0.7rem;
      color: #9aa2ac;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .loading {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    #statusIndicator {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      transition: all 0.3s ease;
    }
    #statusIndicator.active {
      background: #44ff44;
      box-shadow: 0 0 8px #44ff44;
    }
    #statusIndicator.trying {
      background: #ffaa00;
      box-shadow: 0 0 8px #ffaa00;
    }
    #statusIndicator.manual {
      background: #8888ff;
      box-shadow: 0 0 8px #8888ff;
    }
    #statusIndicator.cached {
      background: #00ccff;
      box-shadow: 0 0 8px #00ccff;
    }
    #statusIndicator.error {
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
    }
    #apiStatusText {
      position: absolute;
      top: 15px;
      right: 5px;
      font-size: 0.5rem;
      color: #b0b0b0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="card">
    <div class="accent tl"></div>
    <div class="accent br"></div>
    <div id="statusIndicator"></div>
    <div id="apiStatusText"></div>

    <div id="header">
      <h1>MIRROR</h1>
      <img src="https://icons.dexie.space/0957ed359f099d5846c2c74c42e7c2eb9608b58c32e320e144840e3efab0b747.webp" class="mirror-logo" alt="Mirror logo" />
      <div id="aeBadge">Æ</div>
    </div>
    
    <div id="viewport">
      <div id="stats">
        <div><span>Launch (UTC)</span><span id="launchDate">--</span></div>
        <div><span>Days Deployed</span><span id="days">--</span></div>
        <div><span>Holders</span><span id="holders" class="loading">Loading...</span></div>
        <div><span>Total Supply</span><span id="total" class="loading">Loading...</span></div>
        <div><span>Circulating</span><span id="circ" class="loading">Loading...</span></div>
        <div><span>Burned</span><span id="burned" class="loading">Loading...</span></div>
        <div><span>Price (XCH)</span><span id="price" class="loading">Loading...</span></div>
        <div><span>Today</span><span id="currentDate">--</span></div>
      </div>
      <div id="worldClocks" style="margin-top: 12px; font-size: 0.7rem; color: #b8f5e8; display: flex; flex-wrap: wrap; gap: 6px;"></div>
    </div>
    
    <div id="footer">
      <h2>Multipass</h2>
      <p id="lastUpdate">Initializing...</p>
    </div>
  </div>

  <script>
    // ========================================
    // CONFIGURATION
    // ========================================
    const TOKEN_ID = '0957ed359f099d5846c2c74c42e7c2eb9608b58c32e320e144840e3efab0b747';
    const LAUNCH_DATE = '2025-03-12T11:19:31Z';
    const UPDATE_INTERVAL = 10 * 60 * 1000;
    
    // MANUAL VALUES - Updated with hardcoded MIRROR token data
    const MANUAL_DATA = {
      enabled: true,  // Enabled to use hardcoded values
      holders: 2117,  // Total Holders: 2,117
      totalSupply: 31000000,  // Total Supply: 31,000,000 MIRROR
      circulatingSupply: 29908241.29,  // Circulating Supply: 29,908,241.29 MIRROR
      priceXch: 0  // Will try to fetch from API, or leave as 0 if not available
    };

    console.log('🚀 MIRROR Multipass v3.0');
    console.log('📊 Token ID:', TOKEN_ID);

    // ========================================
    // HELPER FUNCTIONS
    // ========================================
    
    function setStatus(status, text = '') {
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('apiStatusText');
      indicator.className = '';
      if (status) indicator.classList.add(status);
      statusText.textContent = text;
    }

    function updateTimestamp(message = '') {
      const now = new Date();
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      document.getElementById('lastUpdate').textContent = message || `Updated: ${timeStr}`;
    }

    // ========================================
    // STATIC DATA
    // ========================================
    
    const launchDateObj = new Date(LAUNCH_DATE);
    document.getElementById('launchDate').textContent = launchDateObj.toLocaleString(undefined, {
      year: 'numeric', month: 'numeric', day: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: true,
      timeZone: 'UTC'
    }) + ' UTC';

    const daysDiff = Math.floor((Date.now() - new Date(LAUNCH_DATE).getTime()) / (1000 * 60 * 60 * 24));
    document.getElementById('days').textContent = daysDiff.toString();

    function updateCurrentDate() {
      const now = new Date();
      document.getElementById('currentDate').textContent = now.toLocaleDateString(undefined, { 
        year: 'numeric', month: 'numeric', day: 'numeric' 
      });
    }
    updateCurrentDate();

    // ========================================
    // WORLD CLOCKS
    // ========================================
    
    const timeZones = [
      { label: 'UTC', zone: 'UTC' },
      { label: 'NY', zone: 'America/New_York' },
      { label: 'CHI', zone: 'America/Chicago' },
      { label: 'LA', zone: 'America/Los_Angeles' },
      { label: 'LON', zone: 'Europe/London' },
      { label: 'PAR', zone: 'Europe/Paris' },
      { label: 'DXB', zone: 'Asia/Dubai' },
      { label: 'MUM', zone: 'Asia/Kolkata' },
      { label: 'BEI', zone: 'Asia/Shanghai' },
      { label: 'TOK', zone: 'Asia/Tokyo' },
      { label: 'SYD', zone: 'Australia/Sydney' }
    ];
    
    const worldClocksContainer = document.getElementById('worldClocks');
    const clockElements = {};
    
    timeZones.forEach(tz => {
      const span = document.createElement('div');
      span.style.cssText = 'display:flex;flex-direction:column;align-items:center;padding:2px 4px;background:rgba(0,0,0,0.25);border-radius:4px;min-width:70px;text-align:center;';
      span.innerHTML = `<strong style="font-size:0.6rem;color:#8af8e5;">${tz.label}</strong><span style="font-size:0.65rem;">--</span>`;
      worldClocksContainer.appendChild(span);
      clockElements[tz.label] = span.querySelector('span:last-child');
    });
    
    function updateWorldClocks() {
      const now = new Date();
      timeZones.forEach(tz => {
        clockElements[tz.label].textContent = now.toLocaleTimeString(undefined, { 
          hour: '2-digit', minute: '2-digit', timeZone: tz.zone, hour12: false
        });
      });
    }
    
    updateWorldClocks();
    setInterval(() => {
      updateCurrentDate();
      updateWorldClocks();
    }, 1000);

    // ========================================
    // TOKEN DATA FETCHING
    // ========================================
    
    async function fetchTokenData() {
      console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
      console.log('🔄 Loading MIRROR token data...');
      setStatus('trying');
      updateTimestamp('Loading...');
      
      document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));
      
      // Check if manual mode is enabled
      if (MANUAL_DATA.enabled) {
        console.log('📝 Using MANUAL DATA mode with hardcoded values');
        setStatus('manual');
        
        // Try to fetch price from API (optional)
        let priceXch = MANUAL_DATA.priceXch;
        let xchToUsd = 0;
        
        try {
          const xchPriceData = await getXchPrice();
          xchToUsd = xchPriceData.price;

          // Set status based on price source
          if (xchPriceData.source === 'coingecko') {
            setStatus('active', 'CoinGecko');
          } else if (xchPriceData.source === 'spacescan') {
            setStatus('active', 'SpaceScan');
          } else if (xchPriceData.source === 'cached' || xchPriceData.source === 'stale-cache') {
            setStatus('cached', 'Cached');
          }

          // Try to get MIRROR price from Dexie with retry
          if (!priceXch) {
            const dexieUrl = `https://api.dexie.space/v1/cats`;
            const dexieData = await fetchWithRetry(dexieUrl, 2);
            if (dexieData) {
              const mirrorToken = dexieData.find(cat => cat.id === TOKEN_ID);
              if (mirrorToken && mirrorToken.price) {
                priceXch = parseFloat(mirrorToken.price || 0);
                console.log('✅ Found MIRROR price on Dexie:', priceXch);
              }
            }
          }
        } catch (e) {
          console.warn('⚠️ Price fetch failed, using manual data only:', e.message);
        }

        const burnedAmount = MANUAL_DATA.totalSupply - MANUAL_DATA.circulatingSupply;
        const priceUsd = priceXch * xchToUsd;
        
        // Update UI with hardcoded values
        document.getElementById('holders').textContent = MANUAL_DATA.holders.toLocaleString();
        document.getElementById('total').textContent = MANUAL_DATA.totalSupply.toLocaleString();
        document.getElementById('circ').textContent = MANUAL_DATA.circulatingSupply.toLocaleString();
        document.getElementById('burned').textContent = burnedAmount.toLocaleString();
        document.getElementById('price').textContent = priceXch 
          ? `${priceXch.toFixed(8)} XCH ($${priceUsd.toFixed(4)})`
          : 'Not Listed';
        
        updateTimestamp('Hardcoded Data');
        console.log('✅ Manual data displayed');
        console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        return;
      }
      
      try {
        // Try Dexie.space API with retry logic
        console.log('📡 Trying Dexie.space API...');
        const dexieUrl = `https://api.dexie.space/v1/cats`;
        const dexieData = await fetchWithRetry(dexieUrl, 3);

        if (dexieData) {
          const mirrorToken = dexieData.find(cat => cat.id === TOKEN_ID);

          if (mirrorToken) {
            console.log('✅ Found MIRROR on Dexie:', mirrorToken);

            const xchPriceData = await getXchPrice();
            const xchToUsd = xchPriceData.price;
            const totalVal = parseFloat(mirrorToken.total_supply || 0) / 1000; // Convert mojos
            const priceXch = parseFloat(mirrorToken.price || 0);
            const priceUsd = priceXch * xchToUsd;

            // Set status based on price source
            if (xchPriceData.source === 'coingecko') {
              setStatus('active', 'CoinGecko');
            } else if (xchPriceData.source === 'spacescan') {
              setStatus('active', 'SpaceScan');
            } else if (xchPriceData.source === 'cached' || xchPriceData.source === 'stale-cache') {
              setStatus('cached', 'Cached');
            } else {
              setStatus('active', 'Dexie');
            }

            document.getElementById('holders').textContent = mirrorToken.holders || 'N/A';
            document.getElementById('total').textContent = totalVal.toLocaleString();
            document.getElementById('circ').textContent = totalVal.toLocaleString();
            document.getElementById('burned').textContent = '0';
            document.getElementById('price').textContent = priceXch
              ? `${priceXch.toFixed(8)} XCH ($${priceUsd.toFixed(4)})`
              : 'Not Listed';

            updateTimestamp();
            console.log('✅ Success via Dexie!');
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            return;
          } else {
            console.warn('⚠️ MIRROR token not found in Dexie response');
          }
        }

        // If all APIs fail
        throw new Error('Token not found in any API or all API requests failed');

      } catch (err) {
        console.error('❌ API Error:', err.message);
        console.error('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

        setStatus('error', 'Error');
        updateTimestamp('API Error - Check console');

        document.getElementById('holders').textContent = 'API Error';
        document.getElementById('total').textContent = 'API Error';
        document.getElementById('circ').textContent = 'API Error';
        document.getElementById('burned').textContent = 'API Error';
        document.getElementById('price').textContent = 'API Error';
      }
    }
    
    // ========================================
    // PRICE FETCHING WITH COINGECKO + FALLBACKS
    // ========================================

    let priceCache = {
      xchPrice: null,
      timestamp: null,
      ttl: 5 * 60 * 1000 // 5 minutes cache
    };

    /**
     * Fetches XCH price with fallback chain:
     * 1. CoinGecko API (Primary - most reliable)
     * 2. SpaceScan API (Secondary fallback)
     * 3. Cached value (Tertiary fallback)
     */
    async function getXchPrice() {
      // Check cache first
      if (priceCache.xchPrice && priceCache.timestamp &&
          (Date.now() - priceCache.timestamp < priceCache.ttl)) {
        console.log('💾 Using cached XCH price:', priceCache.xchPrice);
        return { price: priceCache.xchPrice, source: 'cached' };
      }

      // Try CoinGecko API (Primary)
      try {
        console.log('🔄 Fetching XCH price from CoinGecko...');
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=chia&vs_currencies=usd', {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (response.ok) {
          const data = await response.json();
          if (data.chia && data.chia.usd) {
            const price = parseFloat(data.chia.usd);
            console.log('✅ CoinGecko XCH price:', price);

            // Update cache
            priceCache.xchPrice = price;
            priceCache.timestamp = Date.now();

            return { price, source: 'coingecko' };
          }
        } else {
          console.warn('⚠️ CoinGecko API returned status:', response.status);
        }
      } catch (e) {
        console.warn('⚠️ CoinGecko API error:', e.message);
      }

      // Fallback to SpaceScan API (Secondary)
      try {
        console.log('🔄 Falling back to SpaceScan API...');
        const response = await fetch('https://api.spacescan.io/stats/price?currency=usd');
        if (response.ok) {
          const data = await response.json();
          if (data.price) {
            const price = parseFloat(data.price);
            console.log('✅ SpaceScan XCH price:', price);

            // Update cache
            priceCache.xchPrice = price;
            priceCache.timestamp = Date.now();

            return { price, source: 'spacescan' };
          }
        }
      } catch (e) {
        console.warn('⚠️ SpaceScan API error:', e.message);
      }

      // Use cached value if available (Tertiary)
      if (priceCache.xchPrice) {
        console.log('⚠️ All APIs failed, using stale cache:', priceCache.xchPrice);
        return { price: priceCache.xchPrice, source: 'stale-cache' };
      }

      console.error('❌ All XCH price sources failed, returning 0');
      return { price: 0, source: 'none' };
    }

    /**
     * Enhanced token data fetching with retry logic
     */
    async function fetchWithRetry(url, retries = 2, delay = 1000) {
      for (let i = 0; i <= retries; i++) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            return await response.json();
          }
          console.warn(`⚠️ Attempt ${i + 1} failed for ${url}:`, response.status);
        } catch (e) {
          console.warn(`⚠️ Attempt ${i + 1} error for ${url}:`, e.message);
        }

        if (i < retries) {
          await new Promise(resolve => setTimeout(resolve, delay));
          delay *= 2; // Exponential backoff
        }
      }
      return null;
    }

    // ========================================
    // INITIALIZATION
    // ========================================
    
    fetchTokenData();
    setInterval(fetchTokenData, UPDATE_INTERVAL);
    console.log('⏰ Auto-refresh: Every 10 minutes');
    
  </script>
</body>
</html>
